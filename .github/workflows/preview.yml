name: Test renders

# Renders key frames with real Blender whenever the 3D scene changes, and publishes a
# contact sheet to the "previews" branch so the look can be checked without a PC.
on:
  push:
    branches: [main]
    paths:
      - book_scene.py
      - page_curl.py
      - camera_fit.py
      - templates.py
      - blender_bridge.py
      - book_model.py
      - live_view.py
      - app.py
      - resources/**
      - tools/**
      - .github/workflows/preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previews
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: python -m pip install numpy pillow -r requirements.txt

      - name: Find the newest Blender
        id: blender
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64) handyman-ci"
          curl -sSL -A "$UA" https://download.blender.org/release/ -o out/releases.html
          DIR=$(grep -oE 'Blender[0-9]+\.[0-9]+/' out/releases.html | sort -u -V | tail -1)
          curl -sSL -A "$UA" "https://download.blender.org/release/$DIR" -o out/dir.html
          FILE=$(grep -oE 'blender-[0-9]+\.[0-9]+\.[0-9]+-linux-x64\.tar\.xz' out/dir.html | sort -u -V | tail -1)
          VER=$(echo "$FILE" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "Blender dir=$DIR file=$FILE" | tee out/find.log
          test -n "$FILE"
          echo "url=https://download.blender.org/release/$DIR$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Cache Blender
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ steps.blender.outputs.version }}

      - name: Download Blender ${{ steps.blender.outputs.version }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -sSL -A "Mozilla/5.0 handyman-ci" "${{ steps.blender.outputs.url }}" | tar -xJ -C ~/blender --strip-components=1

      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 \
            libxkbcommon0 libsm6 xvfb libgl1-mesa-dri fonts-dejavu-core \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 libdbus-1-3 \
            libfontconfig1 libglu1-mesa > /dev/null

      - name: Live 3D view screenshots (the app's own preview)
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QT_QPA_PLATFORM: xcb
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python tools/ci_liveview.py out 2>&1 | tee out/run_live.log; exit ${PIPESTATUS[0]}

      - name: Render with EEVEE (software OpenGL, may be unsupported)
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" python tools/ci_preview.py ~/blender/blender out eevee 2>&1 | tee out/run_eevee.log; exit ${PIPESTATUS[0]}

      - name: Render with Cycles (CPU)
        run: python tools/ci_preview.py ~/blender/blender out cycles 2>&1 | tee out/run_cycles.log; exit ${PIPESTATUS[0]}

      - name: Publish to the previews branch
        if: always()
        run: |
          mkdir -p pub
          cp out/sheet_*.png pub/ 2>/dev/null || true
          cp out/*.log pub/ 2>/dev/null || true
          echo "commit ${GITHUB_SHA} · Blender ${{ steps.blender.outputs.version }} · ${{ job.status }}" > pub/INFO.txt
          cd pub
          git init -q -b previews
          git config user.name "preview-bot"
          git config user.email "preview-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Test renders for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews
