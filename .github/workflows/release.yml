name: Build installer and publish release

# A new release is made whenever APP_VERSION in version.py changes on main.
# Every other push still builds and tests, so mistakes show up before a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt pyinstaller==6.16.0

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python test_curl.py
          python test_support.py
          python test_camera.py
          python test_scene_mock.py > scene_mock.log
          python test_app_smoke.py

      - name: Check the update address answers (uses the permanent repository ID)
        shell: bash
        run: |
          python -c "import json,urllib.request,updater;r=json.loads(urllib.request.urlopen(urllib.request.Request(updater.API,headers={'User-Agent':'ci'}),timeout=20).read());print('latest release seen by installed apps:',r.get('tag_name'),updater.pick_installer(r)['name'])"

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'from version import APP_VERSION;print(APP_VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Build app folder
        run: >
          pyinstaller --noconfirm --clean --windowed --name Handyman
          --icon assets/icon.ico
          --add-data "book_scene.py;."
          --add-data "page_curl.py;."
          --add-data "camera_fit.py;."
          --add-data "resources;resources"
          --add-data "assets;assets"
          app.py

      - name: Check the built app starts
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          test -f dist/Handyman/Handyman.exe
          test -f dist/Handyman/_internal/book_scene.py
          test -f dist/Handyman/_internal/page_curl.py
          test -f dist/Handyman/_internal/camera_fit.py
          test -f dist/Handyman/_internal/resources/books/leather-journal/book.json

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\handyman.iss

      - name: Keep installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Handyman-Setup-${{ steps.ver.outputs.version }}
          path: dist/Handyman-Setup-*.exe
          if-no-files-found: error

      - name: Publish release (only for a new version)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists; bump APP_VERSION in version.py to publish a new one."
            exit 0
          fi
          NOTES="$(python -c "import re,sys;t=open('CHANGES.md',encoding='utf-8').read();m=re.search(r'## '+re.escape('$V')+r'\n(.*?)(\n## |\Z)',t,re.S);print(m.group(1).strip() if m else 'Update.')")"
          gh release create "v$V" dist/Handyman-Setup-$V.exe --target "$GITHUB_SHA" --title "Handyman $V" --notes "$NOTES"
